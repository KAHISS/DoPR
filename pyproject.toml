[project]
name = "do-pr"
version = "0.1.0"
description = "Gera descrições de pull request a partir de diffs do GitHub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gitingest>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
do-pr = "do_pr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/do_pr"]

[tool.hatch.build.targets.wheel.force-include]
"src/do_pr/web/index.html" = "do_pr/web/index.html"
